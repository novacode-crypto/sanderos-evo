name: GitHub Pages

# Publica el prototipo como demo online.
# Requisito unico: Settings -> Pages -> Build and deployment -> Source: GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - "prototype/index.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Desplegar demo del prototipo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Preparar sitio (prototipo autocontenido)
        run: |
          mkdir -p _site
          cp prototype/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
