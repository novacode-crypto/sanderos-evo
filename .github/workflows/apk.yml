name: APK Android

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK del launcher
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Compilar release (firma debug si no hay keystore local)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Renombrar APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "SanderOS-EVO-${{ github.ref_name }}-release.apk"

      - name: Subir como artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: sanderos-evo-apk
          path: android-app/SanderOS-EVO-*-release.apk
          if-no-files-found: error

      - name: Adjuntar a la release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "SanderOS-EVO-${{ github.ref_name }}-release.apk" --clobber
          echo "APK adjuntada a la release ${{ github.ref_name }}"
