<body>
<div class="stage">
  <div class="ptoolbar" id="ptoolbar"></div>
  <div class="device-wrap">
    <div class="device" id="device" data-theme="midnight">
      <div class="screen-root wp-mesh" id="screenRoot">
        <header class="topbar" id="topbar"></header>
        <main class="central">
          <div id="modView"></div>
        </main>
        <div class="dock-zone">
          <div class="dock" id="dock"></div>
          <div class="dock-pages" id="dockPages"></div>
        </div>
        <div class="bottombar-zone">
          <div class="bottombar" id="bottombar"></div>
        </div>
        <!-- Capas superpuestas -->
        <div class="notif-panel" id="notifPanel"></div>
        <div class="ovl" id="ovl"></div>
        <div class="toast-wrap" id="toasts"></div>
        <!-- Pantallas a pantalla completa -->
        <div class="fs-layer splash" id="splash"></div>
        <div class="fs-layer" id="welcome"></div>
        <div class="vplayer" id="vplayer"></div>
        <div class="fprev" id="fprev"></div>
        <div id="call" style="position:absolute;inset:0;z-index:75;pointer-events:none"></div>
      </div>
    </div>
  </div>
</div>
